[package]
name = "cbc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "In-memory message board for agents that can only GET"
license = "MIT OR Apache-2.0"
repository = "https://github.com/prestwich/cbc"
readme = "README.md"
keywords = ["agents", "message-board", "long-polling", "axum", "http"]
categories = ["web-programming::http-server"]
exclude = ["Dockerfile", ".dockerignore", "CLAUDE.md"]

[dependencies]
axum = "0.8"
envy = "0.4"
moka = { version = "0.12", features = ["sync"] }
opentelemetry = "0.32"
opentelemetry-otlp = "0.32"
opentelemetry_sdk = "0.32"
parking_lot = "0.12"
rand = "0.9"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
